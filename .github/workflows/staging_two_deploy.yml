name: Build and Publish Docker Image

on:
    push:
        branches:
            - staging-two

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v1
              with:
                  service_account_key: ${{ secrets.GCP_SA_KEY }}
                  project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Configure Docker to use Google Cloud Artifact Registry
              run: |
                  gcloud auth configure-docker ${GCP_ARTIFACT_REGION}-docker.pkg.dev

            - name: Build Docker image
              run: |
                  docker build -t ${GCP_ARTIFACT_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/alca-repo/alca-app:latest -f alca-app/Dockerfile alca-app

            - name: Push Docker image to GCP Artifact Registry
              run: |
                  docker push ${GCP_ARTIFACT_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/alca-repo/alca-app:latest
